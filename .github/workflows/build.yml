name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S MemoryLatencyAnalyzer_linux -B MemoryLatencyAnalyzer_linux/build -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build MemoryLatencyAnalyzer_linux/build --parallel

      - name: Test
        run: ctest --test-dir MemoryLatencyAnalyzer_linux/build --output-on-failure
